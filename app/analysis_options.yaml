include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    # JSON from the API arrives as Map<dynamic, dynamic> and is cast at the edge
    # in fromJson; flagging every decode site adds noise, not safety.
    strict_raw_type: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: false
    avoid_print: true
    unawaited_futures: true
