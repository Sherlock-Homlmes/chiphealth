name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Worker + D1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migrations + seed apply cleanly on a fresh SQLite
        run: |
          # D1 is SQLite, so a plain sqlite3 run catches schema errors long before
          # a deploy does — including the FTS5 triggers drizzle cannot express.
          sudo apt-get install -y --no-install-recommends sqlite3 >/dev/null
          DB=$(mktemp -d)/ci.db
          for f in migrations/0000_init.sql migrations/0001_food_fts.sql seeds/seed.sql; do
            sed 's|--> statement-breakpoint||' "$f" | sqlite3 "$DB"
          done
          sqlite3 "$DB" "select count(*) from activity_types;" | grep -qv '^0$'
          # remove_diacritics 2 is what makes "com ga" match "cơm gà"
          test -n "$(sqlite3 "$DB" "select f.name from foods_fts join foods f on f.rowid=foods_fts.rowid where foods_fts match '\"com\"*' limit 1;")"
      - name: Bundle for Workers
        run: npx wrangler deploy --dry-run --outdir=dist

  admin:
    name: Admin panel (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          retention-days: 7

  app:
    name: Mobile app (Flutter)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib
