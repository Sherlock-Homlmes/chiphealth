name: Deploy (manual)

# Manual only: Actions -> "Deploy (manual)" -> Run workflow.
#
# Cloudflare resources (D1, R2, Vectorize + metadata index, workers.dev
# subdomain, Pages project, JWT_SECRET) are created on the first run by
# .github/scripts/cloudflare.sh and reused afterwards.
#
# GitHub config (Settings -> Secrets and variables -> Actions). GOOGLE_* and
# BOOTSTRAP_ADMIN_EMAILS are read from Variables first, then Secrets.
#   secret   CLOUDFLARE_API_TOKEN      required
#   secret   CLOUDFLARE_ACCOUNT_ID     only if the token can see several accounts
#   secret   JWT_SECRET                optional, auto-generated once if absent
#   secret   FCM_SERVICE_ACCOUNT_JSON  optional, enables push notifications
#   variable GOOGLE_CLIENT_IDS         required, "web,ios,android" (web first)
#   variable BOOTSTRAP_ADMIN_EMAILS    required to be able to log into admin
#   variable GOOGLE_WEB_CLIENT_ID      optional, defaults to the first GOOGLE_CLIENT_IDS entry
#   variable API_BASE_URL              optional, custom domain for the Worker
#   variable ADMIN_ORIGIN              optional, custom domain for the admin panel
#   variable R2_PUBLIC_URL             optional, public URL of the media bucket

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, backend, admin]
        default: all
      run_migrations:
        description: Apply D1 migrations + seed before deploying the Worker
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  provision:
    name: Provision Cloudflare resources
    runs-on: ubuntu-latest
    environment: production
    outputs:
      d1_id: ${{ steps.cf.outputs.d1_id }}
      r2_bucket: ${{ steps.cf.outputs.r2_bucket }}
      api_base_url: ${{ steps.cf.outputs.api_base_url }}
      admin_origin: ${{ steps.cf.outputs.admin_origin }}
      pages_project: ${{ steps.cf.outputs.pages_project }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required GitHub config
        env:
          GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS || secrets.GOOGLE_CLIENT_IDS }}
          BOOTSTRAP_ADMIN_EMAILS: ${{ vars.BOOTSTRAP_ADMIN_EMAILS || secrets.BOOTSTRAP_ADMIN_EMAILS }}
        run: |
          [ -n "$GOOGLE_CLIENT_IDS" ] || { echo "::error::GOOGLE_CLIENT_IDS is empty. Add it under Settings -> Secrets and variables -> Actions (Variables or Secrets tab, repo level or the production environment)"; exit 1; }
          [ -n "$BOOTSTRAP_ADMIN_EMAILS" ] \
            || echo "::warning::BOOTSTRAP_ADMIN_EMAILS is empty; nobody will be admin"
      - run: .github/scripts/cloudflare.sh account
      - id: cf
        env:
          API_BASE_URL_OVERRIDE: ${{ vars.API_BASE_URL }}
          ADMIN_ORIGIN_OVERRIDE: ${{ vars.ADMIN_ORIGIN }}
        run: .github/scripts/cloudflare.sh provision

  backend:
    name: Backend (Worker + D1)
    needs: provision
    if: ${{ inputs.target != 'admin' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: ../.github/scripts/cloudflare.sh account

      # wrangler.toml in git points at a placeholder D1 id and the dev bucket;
      # swap in production values and append the URL/auth vars to [vars]
      # (the last table in the file) for this run only.
      - name: Render production wrangler.toml
        env:
          D1_DATABASE_ID: ${{ needs.provision.outputs.d1_id }}
          R2_BUCKET_NAME: ${{ needs.provision.outputs.r2_bucket }}
          API_BASE_URL: ${{ needs.provision.outputs.api_base_url }}
          ADMIN_ORIGIN: ${{ needs.provision.outputs.admin_origin }}
          GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS || secrets.GOOGLE_CLIENT_IDS }}
          BOOTSTRAP_ADMIN_EMAILS: ${{ vars.BOOTSTRAP_ADMIN_EMAILS || secrets.BOOTSTRAP_ADMIN_EMAILS }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          for v in D1_DATABASE_ID R2_BUCKET_NAME API_BASE_URL ADMIN_ORIGIN; do
            [ -n "${!v}" ] || { echo "::error::Provision job did not output $v"; exit 1; }
          done
          node <<'EOF'
          const fs = require('fs');
          const env = process.env;
          // push.ts needs the project id next to the service account; it is in the JSON.
          if (env.FCM_SERVICE_ACCOUNT_JSON) {
            env.FCM_PROJECT_ID = JSON.parse(env.FCM_SERVICE_ACCOUNT_JSON).project_id;
          }
          const keys = ['API_BASE_URL', 'ADMIN_ORIGIN', 'GOOGLE_CLIENT_IDS', 'BOOTSTRAP_ADMIN_EMAILS',
                        'R2_BUCKET_NAME', 'R2_PUBLIC_URL', 'FCM_PROJECT_ID'];
          let toml = fs.readFileSync('wrangler.toml', 'utf8')
            .replace(/^database_id = ".*"/m, `database_id = "${env.D1_DATABASE_ID}"`)
            .replace(/^bucket_name = ".*"/m, `bucket_name = "${env.R2_BUCKET_NAME}"`);
          toml += '\n# --- injected by deploy workflow ---\n';
          for (const k of keys) {
            if (env[k]) toml += `${k} = ${JSON.stringify(env[k])}\n`;
          }
          fs.writeFileSync('wrangler.toml', toml);
          EOF
          grep -E '^(database_id|bucket_name) =' wrangler.toml

      # Migrations run before the Worker so new code never meets an old schema.
      # Both are safe to re-run: migrations are tracked, the seed is INSERT OR IGNORE.
      - name: Apply D1 migrations + seed
        if: ${{ inputs.run_migrations }}
        run: |
          npx wrangler d1 migrations apply chiphealth --remote
          npx wrangler d1 execute chiphealth --remote --file=./seeds/seed.sql

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Ensure Worker secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: ../.github/scripts/cloudflare.sh secrets

      # A freshly registered workers.dev subdomain can take a few minutes to resolve.
      - name: Smoke test
        env:
          API_BASE_URL: ${{ needs.provision.outputs.api_base_url }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API_BASE_URL/health" || true)
            [ "$code" = "200" ] && echo "health OK" && exit 0
            sleep 10
          done
          echo "::error::$API_BASE_URL/health never returned 200 (last: $code)"; exit 1

  admin:
    name: Admin panel (Pages)
    needs: [provision, backend]
    # Runs after the backend when deploying both; runs alone for target=admin.
    if: ${{ !cancelled() && needs.provision.result == 'success' && inputs.target != 'backend' && needs.backend.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: ../.github/scripts/cloudflare.sh account

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ needs.provision.outputs.api_base_url }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS || secrets.GOOGLE_CLIENT_IDS }}
          VITE_USE_MSW: 'false'
        run: |
          export VITE_GOOGLE_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID:-${GOOGLE_CLIENT_IDS%%,*}}"
          echo "API: $VITE_API_BASE_URL"
          echo "Google web client: $VITE_GOOGLE_CLIENT_ID"
          npm run build

      - name: Deploy to Cloudflare Pages
        env:
          PAGES_PROJECT: ${{ needs.provision.outputs.pages_project }}
        run: npx --yes wrangler@3 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
